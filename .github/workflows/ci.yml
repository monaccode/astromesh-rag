name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -q
  extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { extra: faiss, test: test_faiss.py }
          - { extra: chroma, test: test_chroma.py }
          - { extra: sentence-transformers, test: test_sentence_transformers.py }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra ${{ matrix.extra }} --python 3.12
      - run: uv run --python 3.12 pytest -q tests/integrations/${{ matrix.test }}
  qdrant:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
    env:
      QDRANT_URL: http://localhost:6333
      RAG_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra qdrant --python 3.12
      - run: uv run --python 3.12 pytest -q tests/integrations/test_qdrant.py
  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_DSN: postgresql://postgres:pg@localhost:5432/postgres
      RAG_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra pgvector --python 3.12
      - run: uv run --python 3.12 pytest -q tests/integrations/test_pgvector.py
