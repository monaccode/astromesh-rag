[project]
name = "astromesh-rag"
version = "0.1.0"
description = "Composable RAG pipelines for AI agents: splitters, embedders, vector and keyword indexes, hybrid retrieval, reranking and retrieval patterns, built from a YAML spec."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Juan Carlos Romero", email = "jc@fulfaro.dev" }]
keywords = ["rag","retrieval","embeddings","vector-search","hybrid-search","reranking","agents","llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
ollama = ["httpx>=0.27"]
hf = ["httpx>=0.27"]
cohere = ["httpx>=0.27"]
openai = ["httpx>=0.27"]
sentence-transformers = ["sentence-transformers>=3.0"]
faiss = ["faiss-cpu>=1.8", "numpy>=1.26"]
chroma = ["chromadb>=0.5"]
qdrant = ["qdrant-client>=1.11"]
pgvector = ["asyncpg>=0.30"]
all = ["httpx>=0.27", "sentence-transformers>=3.0", "faiss-cpu>=1.8", "numpy>=1.26", "chromadb>=0.5", "qdrant-client>=1.11", "asyncpg>=0.30"]

[project.urls]
Homepage = "https://github.com/monaccode/astromesh-rag"
Issues = "https://github.com/monaccode/astromesh-rag/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.16", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["astromesh_rag", "tests", "docs", "README*.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]
exclude = ["uv.lock", ".superpowers", ".github"]

[tool.hatch.build.targets.wheel]
packages = ["astromesh_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W", "I", "UP", "B", "C4", "SIM", "RET", "PERF", "PIE", "DTZ", "LOG", "G", "PT", "N", "PTH", "RUF", "BLE", "PLE", "PLW"]
